# Test Environment
TestEnvironment = QA

# Set ExecutionServer to either Local or Remote
ExecutionServer = Local

# Set InterfaceType to:-
#   - Web for web automation,
#   - Mobile if your tests involve mobile automation only,
#   - API if your tests involve api automation only,
InterfaceType = Web


# If ExecutionServer is set to Remote then the following GRID details are mandatory
GRID_HUB_IP = localhost
GRID_HUB_PORT = 4444

# Set TestBrowser to either chrome, firefox or edge
TestBrowser = chrome

ScreenshotEnable = true

# Files download path
DefaultDownloadPath = ./src/test/resources/Downloads

# Test Data File
TestDataFilePath = /input-data/testdata.xls

# UI Test Parameters
UI_BASE_URL = https://healenium.io/credit-card-step



# API Parameters
